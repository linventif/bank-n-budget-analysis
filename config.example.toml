# Copier vers config.toml (ignoré par git) puis adapter.

[server]
# URL publique du tunnel Cloudflare (qui pointe vers public_addr).
public_url = "https://bks.example.com"
# public_addr = "127.0.0.1:9889"   # cible du tunnel : /terms, /privacy, /callback uniquement
# local_addr  = "127.0.0.1:9890"   # tableau de bord : ne JAMAIS l'exposer
# database    = "data/bank.db"
# web_dir     = "web/dist"        # frontend compilé (cd web && pnpm build)

[legal]
# Adresse affichée publiquement sur /terms et /privacy.
# contact_email = "contact@exemple.fr"

# À décommenter une fois l'application créée sur https://enablebanking.com/cp/applications
# [enable_banking]
# app_id       = "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"    # = nom du fichier .pem
# private_key  = "~/.config/bank-analysis/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee.pem"
# countries    = ["FR"]   # pays dont les banques sont proposées
# consent_days = 180

# Classification des dépenses par un modèle local. Valeurs par défaut :
# [ai]
# enabled     = true
# provider    = "vllm"                       # API compatible OpenAI ; ou "ollama"
# url         = "http://127.0.0.1:8000/v1"   # Ollama : "http://127.0.0.1:11434"
# model       = "Qwen/Qwen3-4B-AWQ"
# batch_size  = 12                           # marchands par requête
# concurrency = 2                            # requêtes simultanées
