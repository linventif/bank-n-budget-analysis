[package]
name = "bks"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }
webauthn-rs = "0.5.5"
