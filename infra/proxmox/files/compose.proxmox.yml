# Surcouche appliquée au compose.yml du dépôt dans le conteneur Proxmox :
#
#   docker compose -f compose.yml -f compose.proxmox.yml up -d      (c'est ce que lance bksctl)
#
# Valeurs interpolées depuis le .env écrit par Terraform (IMAGE_TAG, COMPOSE_PROFILES, ADMIN_BIND).

services:
  # Le tunnel Cloudflare vise http://localhost:9889 (bks.example.com).
  # 9890 (interface locale, sans authentification) : loopback, ou l'IP du conteneur filtrée par bksctl
  # pour n'accepter que l'hôte Proxmox (accès par tunnel SSH).
  bks:
    image: ghcr.io/linventif/bank-n-budget-analysis:${IMAGE_TAG:-latest}
    ports: !override
      - "127.0.0.1:9889:9889"
      - "${ADMIN_BIND:-127.0.0.1}:9890:9890"
    restart: unless-stopped

  # Tunnel sortant uniquement, activé par COMPOSE_PROFILES=tunnel (quand un jeton est fourni).
  # Réseau de l'hôte : les noms publics visent http://localhost:<port>.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file:
      - cloudflared.env
    network_mode: host
    restart: unless-stopped
    profiles:
      - tunnel
